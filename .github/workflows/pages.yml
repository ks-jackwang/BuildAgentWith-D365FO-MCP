name: Build and publish the Lab

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: lab-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install MkDocs
        run: python -m pip install -r requirements.txt
      - name: Read the GitHub Pages URL
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && github.ref_type == 'branch'
        id: pages
        uses: actions/configure-pages@v6
      - name: Build the Lab
        env:
          MKDOCS_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: mkdocs build --strict
      - name: Upload the website
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
